<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>糟糕！是心动鸭！</title>
    <style>
        @font-face {
            font-family: 'FangZhengPixel';
            src: url('assets/fonts/fangzheng-pixel.ttf') format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
        }
        
        body {
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #game-container {
            position: relative;
            background: #0f0f23;
            border: 4px solid #4a4a6a;
            box-shadow: 0 0 20px rgba(100, 100, 200, 0.3);
        }
        
        #game-canvas {
            display: block;
        }
        
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f23;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 1000;
        }
        
        .loading-text {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffcc00;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .pixel-font {
            font-family: 'FangZhengPixel', 'Courier New', monospace;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="960" height="640"></canvas>
        <div id="loading-screen">
            <div class="loading-text pixel-font">正在加载中...</div>
            <div class="loading-spinner"></div>
        </div>
    </div>
    
    <script src="src/main.js" type="module"></script>
</body>
</html>
